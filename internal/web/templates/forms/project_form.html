{{define "content"}}
<header class="top-bar">
  {{if .IsNew}}
    <a class="btn-icon-ghost back" href="/projects" aria-label="Cancel">←</a>
    <h1 class="top-title">New project</h1>
  {{else}}
    <a class="btn-icon-ghost back" href="/projects/{{.Project.ID}}" aria-label="Cancel">←</a>
    <h1 class="top-title">Rename project</h1>
  {{end}}
</header>

{{if .Error}}
<div class="alert-destructive form-error">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <h2>{{.Error}}</h2>
</div>
{{end}}

<form class="form" method="post" action="{{if .IsNew}}/projects{{else}}/projects/{{.Project.ID}}{{end}}">
  <div class="field">
    <label class="label" for="project-name">Name</label>
    <input class="input" id="project-name" type="text" name="name" required autofocus value="{{.Project.Name}}">
  </div>
  <div class="form-actions">
    <a class="btn-outline" href="{{if .IsNew}}/projects{{else}}/projects/{{.Project.ID}}{{end}}">Cancel</a>
    <button type="submit" class="btn">{{if .IsNew}}Create{{else}}Save{{end}}</button>
  </div>
</form>
{{end}}

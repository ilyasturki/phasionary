{{define "content"}}
<header class="top-bar">
  <a class="btn-icon-ghost back" href="/projects" aria-label="Back to projects">←</a>
  <h1 class="top-title">{{.Project.Name}}</h1>
  <div class="top-actions">
    <a class="btn-sm-outline" href="/projects/{{.Project.ID}}/edit">Rename</a>
    <a class="btn-sm" href="/projects/{{.Project.ID}}/categories/new">+ Category</a>
  </div>
</header>

{{if .Project.Categories}}
{{template "categories" (dict "Project" .Project "Categories" .Project.Categories)}}
{{else}}
<div class="alert empty-state">
  <h2>No categories yet</h2>
  <section><a href="/projects/{{.Project.ID}}/categories/new">Add one</a> to start organizing tasks.</section>
</div>
{{end}}

<footer class="bottom-bar">
  <form method="post" action="/projects/{{.Project.ID}}/delete"
        hx-delete="/projects/{{.Project.ID}}"
        hx-confirm="Delete this project and all its data?">
    <button type="submit" class="btn-sm-destructive">Delete project</button>
  </form>
</footer>
{{end}}

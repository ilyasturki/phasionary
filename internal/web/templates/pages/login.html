{{define "content"}}
<header class="top-bar">
  <h1 class="top-title">Sign in</h1>
</header>

{{if .Error}}
<div class="alert-destructive form-error">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <h2>{{.Error}}</h2>
</div>
{{end}}

<form class="form" method="post" action="/login" hx-boost="false">
  <input type="hidden" name="next" value="{{.Next}}">
  <div class="field">
    <label class="label" for="token">Access token</label>
    <input class="input" id="token" type="password" name="token" required autofocus autocomplete="current-password">
  </div>
  <div class="form-actions">
    <button type="submit" class="btn">Sign in</button>
  </div>
</form>
{{end}}

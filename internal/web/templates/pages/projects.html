{{define "content"}}
<header class="top-bar">
  <h1 class="top-title">Projects</h1>
  <div class="top-actions">
    <a class="btn" href="/projects/new">+ New</a>
  </div>
</header>

{{if .Projects}}
<ul class="project-list">
  {{range .Projects}}
    <li>
      <a class="card project-card" href="/projects/{{.ID}}">
        <header>
          <h2>{{.Name}}</h2>
          <p>{{countsLine .StatusCounts}}</p>
        </header>
      </a>
    </li>
  {{end}}
</ul>
{{else}}
<div class="alert empty-state">
  <h2>No projects yet</h2>
  <section><a href="/projects/new">Create one</a> to get started.</section>
</div>
{{end}}
{{end}}

{{define "content"}}
<header class="top-bar">
  <h1>Projects</h1>
  <div class="top-actions">
    <a class="btn btn-primary" href="/projects/new">+ New</a>
  </div>
</header>

{{if .Projects}}
<ul class="project-list">
  {{range .Projects}}
    <li>
      <a class="project-card" href="/projects/{{.ID}}">
        <div class="project-card-title">{{.Name}}</div>
        <div class="project-card-meta">{{countsLine .StatusCounts}}</div>
      </a>
    </li>
  {{end}}
</ul>
{{else}}
<p class="empty">No projects yet. <a href="/projects/new">Create one</a>.</p>
{{end}}
{{end}}

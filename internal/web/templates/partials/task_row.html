{{define "task_row"}}
<li class="task-row task-{{statusSlug .Task.Status}}" id="task-{{.Task.ID}}">
  <div class="task-main">
    <button class="status status-{{statusSlug .Task.Status}}"
            hx-post="/projects/{{.Project.ID}}/categories/{{.Category.ID}}/tasks/{{.Task.ID}}/status"
            hx-target="closest .task-row"
            hx-swap="outerHTML"
            aria-label="Cycle status">{{statusLabel .Task.Status}}</button>
    <a class="task-title" href="/projects/{{.Project.ID}}/categories/{{.Category.ID}}/tasks/{{.Task.ID}}/edit">{{.Task.Title}}</a>
    <button class="priority priority-{{prioritySlug .Task.Priority}}"
            hx-post="/projects/{{.Project.ID}}/categories/{{.Category.ID}}/tasks/{{.Task.ID}}/priority"
            hx-target="closest .task-row"
            hx-swap="outerHTML"
            aria-label="Cycle priority">{{priorityLabel .Task.Priority}}</button>
  </div>
  <div class="task-meta">
    {{if .Task.EstimateMinutes}}<span class="estimate">{{formatEstimate .Task.EstimateMinutes}}</span>{{end}}
    <span class="task-actions">
      <button class="btn-icon"
              hx-post="/projects/{{.Project.ID}}/categories/{{.Category.ID}}/tasks/{{.Task.ID}}/move?dir=up"
              hx-target="#category-{{.Category.ID}}"
              hx-swap="outerHTML"
              aria-label="Move task up">↑</button>
      <button class="btn-icon"
              hx-post="/projects/{{.Project.ID}}/categories/{{.Category.ID}}/tasks/{{.Task.ID}}/move?dir=down"
              hx-target="#category-{{.Category.ID}}"
              hx-swap="outerHTML"
              aria-label="Move task down">↓</button>
      <button class="btn-icon btn-danger"
              hx-delete="/projects/{{.Project.ID}}/categories/{{.Category.ID}}/tasks/{{.Task.ID}}"
              hx-confirm="Delete this task?"
              hx-target="closest .task-row"
              hx-swap="delete"
              aria-label="Delete task">✕</button>
    </span>
  </div>
  {{if .Task.Description}}
  <details class="task-description">
    <summary>Description</summary>
    <div>{{.Task.Description}}</div>
  </details>
  {{end}}
</li>
{{end}}
